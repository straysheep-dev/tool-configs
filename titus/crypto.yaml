rules:

# Rule patterns written to compile correctly for either Hyperscan or Vectorscan.
# The Go fallback to regexp2 is much slower.
#
# Review the existing rules for reference and examples:
# - https://github.com/praetorian-inc/titus/tree/main/pkg/rule/rules

- name: Bitcoin Address
  id: threat_hunting.bstrings.bitcoin_address
  base_score: 20
  description: >
    Matches Bitcoin cryptocurrency wallet address format.
  pattern: '\b[13][a-km-zA-HJ-NP-Z1-9]{25,34}\b'
  min_entropy: 4.0
  confidence: medium
  examples:
  - '1ABCDEFGHJKLMNPQRSTUVWXYZ234567'
  categories:
  - ioc
  - crypto
  references:
  - https://github.com/EricZimmerman/bstrings
  - https://www.antisyphontraining.com/on-demand-courses/regular-expressions-your-new-lifestyle-w-joff-thyer/

- name: Aeon Wallet Address
  id: threat_hunting.bstrings.aeon
  base_score: 20
  description: >
    Matches Aeon cryptocurrency wallet address format.
  pattern: '\bWm[st]{1}[0-9a-zA-Z]{94}\b'
  min_entropy: 4.0
  confidence: medium
  examples:
  - 'WmsABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijk'
  categories:
  - ioc
  - crypto
  references:
  - https://github.com/EricZimmerman/bstrings
  - https://www.antisyphontraining.com/on-demand-courses/regular-expressions-your-new-lifestyle-w-joff-thyer/

